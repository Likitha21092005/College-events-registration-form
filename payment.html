<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            position: relative;
            color: #222222;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
            animation: gradientAnimation 15s ease infinite;
            background-size: 800% 800%;
        }
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(270deg, #6a11cb, #2575fc, #6a11cb, #2575fc);
            background-size: 800% 800%;
            animation: gradientAnimation 15s ease infinite;
            z-index: -1;
            filter: blur(60px);
            opacity: 0.7;
        }
        @keyframes gradientAnimation {
            0% {background-position:0% 50%;}
            50% {background-position:100% 50%;}
            100% {background-position:0% 50%;}
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(118, 75, 162, 0.4);
            animation: fadeInUp 1.5s ease forwards, pulseShadow 3s ease infinite;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        @keyframes pulseShadow {
            0%, 100% {
                box-shadow: 0 8px 30px rgba(118, 75, 162, 0.4);
            }
            50% {
                box-shadow: 0 12px 40px rgba(118, 75, 162, 0.6);
            }
        }
        h1 {
            color: #2C3E50;
        }
        img.qr-code {
            width: 250px;
            height: 250px;
            margin: 20px 0;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.5);
            animation: pulseShadow 3s ease infinite;
        }
        .phone-number {
            font-size: 18px;
            margin-bottom: 20px;
            color: #764ba2;
            font-weight: 700;
            text-shadow: 0 0 5px #764ba2;
        }
        button {
            background-color: #764ba2;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            width: 100%;
            font-weight: 700;
            box-shadow: 0 6px 15px rgba(118, 75, 162, 0.6);
        }
        button:hover {
            background-color: #5a2d8c;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(90, 45, 140, 0.8);
        }
        #popup {
            display: none;
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -30%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            padding: 30px;
            max-width: 400px;
            width: 90%;
            z-index: 1000;
            color: #2C3E50;
            animation: fadeInUp 1s ease forwards;
        }
        #popup h2 {
            margin-top: 0;
        }
        #registrationId {
            color: #764ba2;
            cursor: pointer;
            font-weight: 700;
            text-decoration: underline;
            margin-top: 15px;
            display: inline-block;
        }
        #overlay {
            display: none;
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment</h1>
        <p>Please scan the QR code below to make your payment</p>
        <img src="QR.jpg" alt="Payment QR Code" class="qr-code" />
        <p class="phone-number">Phone Number for Payment: 9812763450</p>
        <button id="paymentCompleteBtn">Payment Completed</button>
    </div>

    <div id="overlay"></div>
    <div id="popup">
        <h2>Registration Payment Successful!</h2>
        <p>Your registration ID is:</p>
        <span id="registrationId"></span>
    </div>

    <script>
        function generateRegistrationId() {
            return 'REG-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        }

        const paymentCompleteBtn = document.getElementById('paymentCompleteBtn');
        const popup = document.getElementById('popup');
        const overlay = document.getElementById('overlay');
        const registrationIdSpan = document.getElementById('registrationId');

        paymentCompleteBtn.addEventListener('click', () => {
            const registrationId = generateRegistrationId();
            registrationIdSpan.textContent = registrationId;

            // Save registration ID and payment status to localStorage
            let registrationData = JSON.parse(localStorage.getItem('registrationData')) || {};
            registrationData.paymentCompleted = true;
            registrationData.registrationId = registrationId;
            localStorage.setItem('registrationData', JSON.stringify(registrationData));

            overlay.style.display = 'block';
            popup.style.display = 'block';
        });

        registrationIdSpan.addEventListener('click', () => {
            // Navigate to registration details page
            window.location.href = 'registration-details.html';
        });

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            popup.style.display = 'none';
        });
    </script>
</body>
</html>
